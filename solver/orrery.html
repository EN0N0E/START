<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>φ-Shell Orrery — Primorial Orbital Mechanics</title>
<style>
:root {
  --bg: #0a0a12;
  --fg: #e8e4dc;
  --dim: #5a5666;
  --gold: #c9a84c;
  --panel-bg: rgba(10,10,18,0.92);
  --accent: #7b9ec8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'SF Mono', 'Fira Code', monospace;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}
#hud {
  position: absolute;
  top: 16px; left: 16px;
  font-size: 11px; line-height: 1.6;
  pointer-events: none; z-index: 10;
}
#hud h1 { font-size: 14px; color: var(--gold); margin-bottom: 4px; font-weight: 500; letter-spacing: 0.5px; }
#hud .sub { color: var(--dim); font-size: 10px; }
#phi-panel {
  position: absolute; top: 16px; right: 16px;
  background: var(--panel-bg);
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 8px; padding: 12px 16px;
  z-index: 10; font-size: 11px; min-width: 220px;
}
#phi-panel h2 { font-size: 12px; color: var(--gold); margin-bottom: 8px; font-weight: 500; }
#phi-panel table { width: 100%; border-collapse: collapse; }
#phi-panel td { padding: 2px 6px; font-variant-numeric: tabular-nums; }
#phi-panel td:first-child { color: var(--accent); }
#phi-panel td:nth-child(2) { color: var(--fg); text-align: right; }
#phi-panel td:nth-child(3) { color: var(--gold); text-align: right; }
#phi-panel td:nth-child(4) { text-align: right; }
.res-good { color: #6dca7d; }
.res-ok { color: #c9a84c; }
.res-off { color: #c75050; }
#time-panel {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--panel-bg);
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 8px; padding: 12px 24px;
  z-index: 10; display: flex; flex-direction: column;
  align-items: center; gap: 8px; min-width: 500px;
}
#time-panel label { font-size: 11px; color: var(--dim); }
#time-panel .time-display { font-size: 14px; color: var(--gold); font-variant-numeric: tabular-nums; }
#time-slider { width: 100%; accent-color: var(--gold); cursor: pointer; }
#time-buttons { display: flex; gap: 8px; margin-top: 4px; }
#time-buttons button {
  background: rgba(201,168,76,0.15);
  border: 1px solid rgba(201,168,76,0.4);
  color: var(--gold); font-size: 10px; padding: 3px 10px;
  border-radius: 4px; cursor: pointer; font-family: inherit;
}
#time-buttons button:hover { background: rgba(201,168,76,0.3); }
#transport {
  position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px;
  background: var(--panel-bg);
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 8px; padding: 8px 18px; z-index: 10; font-size: 11px;
}
#transport button {
  background: rgba(201,168,76,0.15);
  border: 1px solid rgba(201,168,76,0.4);
  color: var(--gold); font-size: 14px;
  width: 34px; height: 34px; border-radius: 50%;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
#transport button:hover { background: rgba(201,168,76,0.35); }
#transport button.active { background: rgba(201,168,76,0.4); border-color: var(--gold); }
#transport .speed-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
#transport .speed-group label { color: var(--dim); font-size: 9px; }
#transport .speed-group input { width: 100px; accent-color: var(--gold); }
#transport .speed-val { color: var(--fg); font-size: 10px; font-variant-numeric: tabular-nums; }
#legend {
  position: absolute; bottom: 100px; right: 16px;
  font-size: 10px; color: var(--dim); z-index: 10;
}
#legend div { margin: 3px 0; display: flex; align-items: center; gap: 6px; }
#legend .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#tooltip {
  position: absolute; display: none;
  background: var(--panel-bg);
  border: 1px solid rgba(201,168,76,0.4);
  border-radius: 6px; padding: 8px 12px;
  font-size: 11px; pointer-events: none;
  z-index: 20; max-width: 220px;
}
</style>
</head>
<body>

<div id="hud">
  <h1>φ-Shell Orrery</h1>
  <div class="sub">Primorial Orbital Mechanics — 3D</div>
  <div class="sub" style="margin-top:4px;">r<sub>n</sub> = r₀ · φⁿ — zero free parameters</div>
  <div class="sub" style="margin-top:8px; color:var(--accent);" id="anim-status">▶ Running</div>
</div>

<div id="phi-panel">

  <table>

  </table>
  <div style="margin-top:8px; color:var(--dim); font-size:10px;">
    r₀ = 0.387 AU (Mercury)<br>
    φ = 1.618033988...

</div>

<div id="time-panel">
  <label>Time offset from J2000.0 (2000-01-01)</label>
  <div class="time-display" id="time-display">2000 CE</div>
  <input type="range" id="time-slider" min="-50000000" max="50000000" value="0" step="100">
  <div id="time-buttons">
    <button data-yr="-50000000">−50 Myr</button>
    <button data-yr="-1000000">−1 Myr</button>
    <button data-yr="-10000">−10 kyr</button>
    <button data-yr="-1000">−1 kyr</button>
    <button data-yr="0">Now</button>
    <button data-yr="1000">+1 kyr</button>

</div>

<div id="transport">
  <button id="dir-btn" title="Rewind (past)" class="active">◀</button>
  <button id="play-btn" title="Play / Pause">⏸</button>
  <button id="dir-fwd-btn" title="Forward (future)">▶</button>
  <div class="speed-group">
    <label>Speed</label>

<div id="legend">
  <div><span class="swatch" style="background:#a0a0a0;"></span> Mercury</div>
  <div><span class="swatch" style="background:#e6c47a;"></span> Venus</div>
  <div><span class="swatch" style="background:#4488cc;"></span> Earth</div>
  <div><span class="swatch" style="background:#cc5533;"></span> Mars</div>
  <div><span class="swatch" style="background:#cc9966;"></span> Jupiter</div>
  <div><span class="swatch" style="background:#d4b896;"></span> Saturn</div>
  <div><span class="swatch" style="background:#66cccc;"></span> Uranus</div>
  <div><span class="swatch" style="background:#4466aa;"></span> Neptune</div>
  <div style="margin-top:6px;"><span class="swatch" style="background:var(--gold); opacity:0.4;"></span> φⁿ shells</div>
</div>

<div id="tooltip"></div>

<script>
// ─── Three.js r128 inline (module-less UMD) ───
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
// ─── OrbitControls inline ───
// Minimal orbit controls
(function(){
  var OC = function(camera, domElement){
    this.camera = camera;
    this.domElement = domElement;
    this.target = new THREE.Vector3();
    this.enableDamping = true;
    this.dampingFactor = 0.08;
    this.rotateSpeed = 0.6;
    this.zoomSpeed = 1.2;
    this.minDistance = 2;
    this.maxDistance = 200;
    var scope = this;
    var spherical = new THREE.Spherical();
    var sphericalDelta = new THREE.Spherical();
    var panOffset = new THREE.Vector3();
    var scale = 1;
    var rotateStart = new THREE.Vector2();
    var panStart = new THREE.Vector2();
    var state = 0; // 0=none,1=rotate,2=zoom,3=pan

    function getZoomScale(){ return Math.pow(0.95, scope.zoomSpeed); }

    this.update = function(){
      var offset = new THREE.Vector3();
      offset.copy(scope.camera.position).sub(scope.target);
      spherical.setFromVector3(offset);
      spherical.theta += sphericalDelta.theta;
      spherical.phi += sphericalDelta.phi;
      spherical.phi = Math.max(0.01, Math.min(Math.PI - 0.01, spherical.phi));
      spherical.radius *= scale;
      spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius));
      scope.target.add(panOffset);
      offset.setFromSpherical(spherical);
      scope.camera.position.copy(scope.target).add(offset);
      scope.camera.lookAt(scope.target);
      if(scope.enableDamping){
        sphericalDelta.theta *= (1 - scope.dampingFactor);
        sphericalDelta.phi *= (1 - scope.dampingFactor);
      } else {
        sphericalDelta.set(0,0,0);
      }
      panOffset.set(0,0,0);
      scale = 1;
    };

    function onMouseDown(e){
      if(e.button === 0) { state = 1; rotateStart.set(e.clientX, e.clientY); }
      else if(e.button === 2) { state = 3; panStart.set(e.clientX, e.clientY); }
    }
    function onMouseMove(e){
      if(state === 1){
        var dx = e.clientX - rotateStart.x;
        var dy = e.clientY - rotateStart.y;
        sphericalDelta.theta -= 2 * Math.PI * dx / domElement.clientWidth * scope.rotateSpeed;
        sphericalDelta.phi -= 2 * Math.PI * dy / domElement.clientHeight * scope.rotateSpeed;
        rotateStart.set(e.clientX, e.clientY);
      } else if(state === 3){
        var dx = e.clientX - panStart.x;
        var dy = e.clientY - panStart.y;
        var offset = new THREE.Vector3();
        offset.copy(scope.camera.position).sub(scope.target);
        var dist = offset.length();
        var factor = dist * Math.tan(scope.camera.fov/2 * Math.PI/180) * 2 / domElement.clientHeight;
        var right = new THREE.Vector3();
        right.crossVectors(scope.camera.up, offset).normalize();
        var up = new THREE.Vector3();
        up.crossVectors(offset, right).normalize();
        panOffset.add(right.multiplyScalar(-dx * factor));
        panOffset.add(up.multiplyScalar(dy * factor));
        panStart.set(e.clientX, e.clientY);
      }
    }
    function onMouseUp(){ state = 0; }
    function onWheel(e){
      e.preventDefault();
      if(e.deltaY > 0) scale /= getZoomScale();
      else scale *= getZoomScale();
    }
    function onContext(e){ e.preventDefault(); }

    domElement.addEventListener('mousedown', onMouseDown);
    domElement.addEventListener('mousemove', onMouseMove);
    domElement.addEventListener('mouseup', onMouseUp);
    domElement.addEventListener('wheel', onWheel, {passive:false});
    domElement.addEventListener('contextmenu', onContext);

    // Touch support
    var touchState = 0, touchDist = 0;
    domElement.addEventListener('touchstart', function(e){
      if(e.touches.length === 1){ touchState = 1; rotateStart.set(e.touches[0].clientX, e.touches[0].clientY); }
      else if(e.touches.length === 2){
        touchState = 2;
        touchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      }
    }, {passive:false});
    domElement.addEventListener('touchmove', function(e){
      e.preventDefault();
      if(touchState === 1 && e.touches.length === 1){
        var dx = e.touches[0].clientX - rotateStart.x;
        var dy = e.touches[0].clientY - rotateStart.y;
        sphericalDelta.theta -= 2*Math.PI*dx/domElement.clientWidth*scope.rotateSpeed;
        sphericalDelta.phi -= 2*Math.PI*dy/domElement.clientHeight*scope.rotateSpeed;
        rotateStart.set(e.touches[0].clientX, e.touches[0].clientY);
      } else if(touchState === 2 && e.touches.length === 2){
        var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        if(d > touchDist) scale *= getZoomScale();
        else scale /= getZoomScale();
        touchDist = d;
      }
    }, {passive:false});
    domElement.addEventListener('touchend', function(){ touchState = 0; });
  };
  THREE.OrbitControls = OC;
})();

// ─── Constants ───
const PHI = (1 + Math.sqrt(5)) / 2;
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const AU_SCALE = 1; // 1 AU = 1 scene unit

// ─── Keplerian elements at J2000.0 + secular rates (/century) ───
const PLANETS = [
  { name:'Mercury', color:0xa0a0a0, css:'#a0a0a0', size:0.06,
    el:[0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593],
    rt:[0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081]},
  { name:'Venus', color:0xe6c47a, css:'#e6c47a', size:0.08,
    el:[0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255],
    rt:[0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418]},
  { name:'Earth', color:0x4488cc, css:'#4488cc', size:0.09,
    el:[1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0.0],
    rt:[0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0.0]},
  { name:'Mars', color:0xcc5533, css:'#cc5533', size:0.07,
    el:[1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891],
    rt:[0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343]},
  { name:'Jupiter', color:0xcc9966, css:'#cc9966', size:0.18,
    el:[5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909],
    rt:[-0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106]},
  { name:'Saturn', color:0xd4b896, css:'#d4b896', size:0.15,
    el:[9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448],
    rt:[-0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794]},
  { name:'Uranus', color:0x66cccc, css:'#66cccc', size:0.11,
    el:[19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503],
    rt:[-0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589]},
  { name:'Neptune', color:0x4466aa, css:'#4466aa', size:0.10,
    el:[30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574],
    rt:[0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.00508664]}
];

const R0 = 0.38709927;
const PHI_SHELLS = [];
for (let n = 0; n <= 12; n++) PHI_SHELLS.push({ n, r: R0 * Math.pow(PHI, n) });

// ─── Scene setup ───
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(15, 25, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0a12);
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 150;
controls.target.set(0, 0, 0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Lighting ───
scene.add(new THREE.AmbientLight(0x444466, 0.5));
const sunLight = new THREE.PointLight(0xfff4d6, 2, 100);
scene.add(sunLight);

// ─── Sun ───
const sunGeo = new THREE.SphereGeometry(0.25, 32, 32);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc33 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
scene.add(sunMesh);

// Sun glow sprite
const glowCanvas = document.createElement('canvas');
glowCanvas.width = 128; glowCanvas.height = 128;
const gctx = glowCanvas.getContext('2d');
const grad = gctx.createRadialGradient(64,64,0,64,64,64);
grad.addColorStop(0, 'rgba(255,220,100,0.8)');
grad.addColorStop(0.3, 'rgba(255,180,50,0.3)');
grad.addColorStop(1, 'rgba(255,150,0,0)');
gctx.fillStyle = grad;
gctx.fillRect(0,0,128,128);
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending }));
glowSprite.scale.set(1.5, 1.5, 1);
scene.add(glowSprite);

// ─── Ecliptic grid ───
const gridGroup = new THREE.Group();
scene.add(gridGroup);
const gridMat = new THREE.LineBasicMaterial({ color: 0x222233, transparent: true, opacity: 0.3 });
for (let r = 5; r <= 35; r += 5) {
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const a = (i/64) * TAU;
    pts.push(new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r));
  }
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
}
for (let i = 0; i < 12; i++) {
  const a = (i/12) * TAU;
  const pts = [new THREE.Vector3(0,0,0), new THREE.Vector3(Math.cos(a)*35, 0, Math.sin(a)*35)];
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
}

// ─── φ-shell rings ───
const shellGroup = new THREE.Group();
scene.add(shellGroup);
const shellMat = new THREE.LineDashedMaterial({ color: 0xc9a84c, transparent: true, opacity: 0.35, dashSize: 0.3, gapSize: 0.2 });

for (const shell of PHI_SHELLS) {
  if (shell.r > 40) continue;
  const pts = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i/128) * TAU;
    pts.push(new THREE.Vector3(Math.cos(a)*shell.r, 0, Math.sin(a)*shell.r));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, shellMat.clone());
  line.computeLineDistances();
  shellGroup.add(line);

  // Label sprite
  if (shell.r > 0.3 && shell.r < 40) {
    const lc = document.createElement('canvas');
    lc.width = 64; lc.height = 24;
    const lx = lc.getContext('2d');
    lx.font = '14px monospace';
    lx.fillStyle = 'rgba(201,168,76,0.6)';
    const sup = '⁰¹²³⁴⁵⁶⁷⁸⁹';
    const txt = 'φ' + String(shell.n).split('').map(d => sup[parseInt(d)]).join('');
    lx.fillText(txt, 2, 16);
    const lt = new THREE.CanvasTexture(lc);
    const ls = new THREE.Sprite(new THREE.SpriteMaterial({ map: lt, transparent: true }));
    ls.position.set(shell.r + 0.3, 0.3, 0);
    ls.scale.set(1.2, 0.45, 1);
    shellGroup.add(ls);
  }
}

// ─── Planet meshes + orbit lines ───
const planetMeshes = [];
const orbitLines = [];
const labelSprites = [];

for (const p of PLANETS) {
  // Planet sphere
  const geo = new THREE.SphereGeometry(p.size, 16, 16);
  const mat = new THREE.MeshStandardMaterial({ color: p.color, emissive: p.color, emissiveIntensity: 0.3 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { planet: p };
  scene.add(mesh);
  planetMeshes.push(mesh);

  // Glow sprite per planet
  const gc = document.createElement('canvas');
  gc.width = 64; gc.height = 64;
  const gx = gc.getContext('2d');
  const gg = gx.createRadialGradient(32,32,0,32,32,32);
  const cs = '#' + p.color.toString(16).padStart(6,'0');
  gg.addColorStop(0, cs + '80');
  gg.addColorStop(1, cs + '00');
  gx.fillStyle = gg;
  gx.fillRect(0,0,64,64);
  const gt = new THREE.CanvasTexture(gc);
  const gs = new THREE.Sprite(new THREE.SpriteMaterial({ map: gt, transparent: true, blending: THREE.AdditiveBlending }));
  gs.scale.set(p.size*5, p.size*5, 1);
  mesh.add(gs);

  // Orbit line
  const oGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(361 * 3);
  oGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const oMat = new THREE.LineBasicMaterial({ color: p.color, transparent: true, opacity: 0.3 });
  const oLine = new THREE.Line(oGeo, oMat);
  scene.add(oLine);
  orbitLines.push(oLine);

  // Name label
  const nc = document.createElement('canvas');
  nc.width = 128; nc.height = 32;
  const nx = nc.getContext('2d');
  nx.font = '14px monospace';
  nx.fillStyle = cs;
  nx.fillText(p.name, 2, 20);
  const nt = new THREE.CanvasTexture(nc);
  const ns = new THREE.Sprite(new THREE.SpriteMaterial({ map: nt, transparent: true }));
  ns.scale.set(2, 0.5, 1);
  mesh.add(ns);
  ns.position.set(p.size + 0.5, p.size + 0.3, 0);
  labelSprites.push(ns);
}

// ─── Kepler solver ───
function planetPos3D(p, T) {
  const a = p.el[0] + p.rt[0] * T;
  const e = Math.max(0, Math.min(0.99, p.el[1] + p.rt[1] * T));
  const I = (p.el[2] + p.rt[2] * T) * DEG;
  const L = (p.el[3] + p.rt[3] * T) * DEG;
  const wp = (p.el[4] + p.rt[4] * T) * DEG;
  const Om = (p.el[5] + p.rt[5] * T) * DEG;

  const M = L - wp;
  let E = M;
  for (let i = 0; i < 12; i++) E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));

  const v = 2 * Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
  const r = a * (1 - e * Math.cos(E));

  const xp = r * Math.cos(v);
  const yp = r * Math.sin(v);

  const cosOm = Math.cos(Om), sinOm = Math.sin(Om);
  const cosI = Math.cos(I), sinI = Math.sin(I);
  const cosW = Math.cos(wp-Om), sinW = Math.sin(wp-Om);

  // Ecliptic x,y,z
  const xe = (cosOm*cosW - sinOm*sinW*cosI)*xp + (-cosOm*sinW - sinOm*cosW*cosI)*yp;
  const ye = (sinOm*cosW + cosOm*sinW*cosI)*xp + (-sinOm*sinW + cosOm*cosW*cosI)*yp;
  const ze = (sinW*sinI)*xp + (cosW*sinI)*yp;

  // Three.js: x=ecliptic-x, y=ecliptic-z (up), z=ecliptic-y
  return { x: xe, y: ze, z: ye, r, a };
}

function updateOrbit(p, idx, T) {
  const a = p.el[0] + p.rt[0] * T;
  const e = Math.max(0, Math.min(0.99, p.el[1] + p.rt[1] * T));
  const I = (p.el[2] + p.rt[2] * T) * DEG;
  const wp = (p.el[4] + p.rt[4] * T) * DEG;
  const Om = (p.el[5] + p.rt[5] * T) * DEG;
  const cosOm = Math.cos(Om), sinOm = Math.sin(Om);
  const cosI = Math.cos(I), sinI = Math.sin(I);
  const cosW = Math.cos(wp-Om), sinW = Math.sin(wp-Om);

  const positions = orbitLines[idx].geometry.attributes.position.array;
  for (let i = 0; i <= 360; i++) {
    const M = (i/360) * TAU;
    let E = M;
    for (let j = 0; j < 6; j++) E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    const v = 2 * Math.atan2(Math.sqrt(1+e)*Math.sin(E/2), Math.sqrt(1-e)*Math.cos(E/2));
    const r = a * (1 - e * Math.cos(E));
    const xp = r * Math.cos(v), yp = r * Math.sin(v);
    const xe = (cosOm*cosW - sinOm*sinW*cosI)*xp + (-cosOm*sinW - sinOm*cosW*cosI)*yp;
    const ye = (sinOm*cosW + cosOm*sinW*cosI)*xp + (-sinOm*sinW + cosOm*cosW*cosI)*yp;
    const ze = (sinW*sinI)*xp + (cosW*sinI)*yp;
    positions[i*3] = xe;
    positions[i*3+1] = ze;
    positions[i*3+2] = ye;
  }
  orbitLines[idx].geometry.attributes.position.needsUpdate = true;
}

// ─── φ-shell residual table ───
function updatePhiTable(T) {
  const tbody = document.getElementById('phi-table');
  let html = '';
  for (const p of PLANETS) {
    const a = p.el[0] + p.rt[0] * T;
    let bestN = 0, bestDist = Infinity;
    for (let n = 0; n <= 12; n++) {
      const d = Math.abs(a - R0*Math.pow(PHI,n)) / (R0*Math.pow(PHI,n));
      if (d < bestDist) { bestDist = d; bestN = n; }
    }
    const shellR = R0 * Math.pow(PHI, bestN);
    const pct = ((a - shellR) / shellR * 100).toFixed(1);
    const absPct = Math.abs(parseFloat(pct));
    const cls = absPct < 5 ? 'res-good' : absPct < 15 ? 'res-ok' : 'res-off';
    const sup = '⁰¹²³⁴⁵⁶⁷⁸⁹';
    const sn = String(bestN).split('').map(d=>sup[parseInt(d)]).join('');
    html += `<tr><td>${p.name}</td><td>${a.toFixed(3)}</td><td>φ${sn}=${shellR.toFixed(3)}</td><td class="${cls}">${pct>0?'+':''}${pct}%</td></tr>`;
  }
  tbody.innerHTML = html;
}

// ─── Time state ───
let timeYears = 0;
let animSpeed = -10;
let animating = true;
let lastTime = performance.now();
let timeDir = -1;

// ─── Raycaster for tooltip ───
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(planetMeshes);
  if (hits.length > 0) {
    const p = hits[0].object.userData.planet;
    const T = timeYears / 100;
    const a = p.el[0] + p.rt[0] * T;
    const pos = planetPos3D(p, T);
    let bestN = 0, bestDist = Infinity;
    for (let n = 0; n <= 12; n++) {
      const d = Math.abs(a - R0*Math.pow(PHI,n));
      if (d < bestDist) { bestDist = d; bestN = n; }
    }
    const shellR = R0 * Math.pow(PHI, bestN);
    const pct = ((a - shellR) / shellR * 100).toFixed(2);
    const sup = '⁰¹²³⁴⁵⁶⁷⁸⁹';
    const sn = String(bestN).split('').map(d=>sup[parseInt(d)]).join('');
    tooltip.innerHTML = `<strong style="color:${p.css}">${p.name}</strong><br>
      a = ${a.toFixed(4)} AU<br>
      r = ${pos.r.toFixed(4)} AU<br>
      φ${sn} shell = ${shellR.toFixed(4)} AU<br>
      Δ = ${pct}%`;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

// ─── Animation loop ───
let orbitsNeedUpdate = true;
let lastOrbitT = null;

function animate(now) {
  requestAnimationFrame(animate);

  if (animating) {
    const dt = (now - lastTime) / 1000;
    timeYears += animSpeed * dt;
    timeYears = Math.max(-50000000, Math.min(50000000, timeYears));
    document.getElementById('time-slider').value = timeYears;
  }
  lastTime = now;

  const T = timeYears / 100;

  // Update planet positions
  for (let i = 0; i < PLANETS.length; i++) {
    const pos = planetPos3D(PLANETS[i], T);
    planetMeshes[i].position.set(pos.x, pos.y, pos.z);
  }

  // Update orbits periodically (expensive)
  const orbitT = Math.round(T * 10) / 10;
  if (orbitT !== lastOrbitT) {
    for (let i = 0; i < PLANETS.length; i++) updateOrbit(PLANETS[i], i, T);
    lastOrbitT = orbitT;
    updatePhiTable(T);
  }

  // Time display
  const yr = 2000 + timeYears;
  let displayStr;
  if (Math.abs(timeYears) < 10000) {
    displayStr = yr < 0 ? `${Math.abs(yr).toFixed(0)} BCE` : `${yr.toFixed(0)} CE`;
  } else if (Math.abs(timeYears) < 1000000) {
    const sign = timeYears > 0 ? '+' : '';
    displayStr = `${sign}${(timeYears/1000).toFixed(1)} kyr`;
  } else {
    const sign = timeYears > 0 ? '+' : '';
    displayStr = `${sign}${(timeYears/1000000).toFixed(2)} Myr`;
  }
  document.getElementById('time-display').textContent = displayStr;

  controls.update();
  renderer.render(scene, camera);
}

// ─── Transport controls ───
function updateDirBtns() {
  document.getElementById('dir-btn').classList.toggle('active', timeDir < 0);
  document.getElementById('dir-fwd-btn').classList.toggle('active', timeDir > 0);
}
function updatePlayBtn() {
  document.getElementById('play-btn').textContent = animating ? '⏸' : '▶';
  document.getElementById('anim-status').textContent = animating ? '▶ Running' : '⏸ Paused';
}
function updateSpeedLabel() {
  const abs = Math.abs(animSpeed);
  let label;
  if (abs < 1) label = `${abs.toFixed(1)} yr/s`;
  else if (abs < 1000) label = `${abs.toFixed(0)} yr/s`;
  else if (abs < 1000000) label = `${(abs/1000).toFixed(1)} kyr/s`;
  else label = `${(abs/1000000).toFixed(1)} Myr/s`;
  document.getElementById('speed-val').textContent = label;
}

const slider = document.getElementById('time-slider');
slider.addEventListener('input', () => {
  timeYears = parseFloat(slider.value);
  animating = false;
  updatePlayBtn();
});

document.querySelectorAll('#time-buttons button').forEach(btn => {
  btn.addEventListener('click', () => {
    timeYears = parseFloat(btn.dataset.yr);
    slider.value = timeYears;
    animating = false;
    updatePlayBtn();
  });
});

const speedSlider = document.getElementById('speed-slider');
speedSlider.addEventListener('input', () => {
  const v = parseFloat(speedSlider.value);
  animSpeed = timeDir * Math.pow(10, v - 1);
  updateSpeedLabel();
});
speedSlider.addEventListener('change', () => {
  if (!animating) { animating = true; updatePlayBtn(); }
});

document.getElementById('dir-btn').addEventListener('click', () => {
  timeDir = -1;
  animSpeed = -Math.abs(animSpeed);
  if (!animating) { animating = true; updatePlayBtn(); }
  updateDirBtns();
});
document.getElementById('dir-fwd-btn').addEventListener('click', () => {
  timeDir = 1;
  animSpeed = Math.abs(animSpeed);
  if (!animating) { animating = true; updatePlayBtn(); }
  updateDirBtns();
});
document.getElementById('play-btn').addEventListener('click', () => {
  animating = !animating;
  updatePlayBtn();
});

updateSpeedLabel();
updateDirBtns();
updatePlayBtn();

// Start
requestAnimationFrame(animate);
</script>
</body>
</html>
