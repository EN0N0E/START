<title>210-Gon Primorial Prism</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#06060e;overflow:hidden;font-family:'SF Mono','Fira Code','Cascadia Code',monospace;color:#8899aa}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas:active{cursor:grabbing}
  .panel{position:fixed;top:24px;left:24px;z-index:10;user-select:none}
  .title{font-size:13px;letter-spacing:.25em;color:#aabbcc;text-transform:uppercase}
  .subtitle{font-size:11px;color:#556677;margin:4px 0 20px;font-variant-numeric:tabular-nums}
  .prime-row{display:flex;gap:8px;margin-bottom:20px}
  .pbtn{
    width:56px;height:56px;border:2px solid;border-radius:6px;background:transparent;
    cursor:pointer;font-family:inherit;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;transition:all .2s;
  }
  .pbtn .num{font-size:20px;font-weight:700}
  .pbtn .lbl{font-size:7px;letter-spacing:.12em;opacity:.6;text-transform:uppercase}
  .pbtn:not(.on){opacity:.25;border-style:dashed}
  .pbtn.on{background:rgba(255,255,255,.04)}
  .pbtn[data-p="2"]{border-color:#3388ff;color:#3388ff}
  .pbtn[data-p="3"]{border-color:#ffaa22;color:#ffaa22}
  .pbtn[data-p="5"]{border-color:#ff2288;color:#ff2288}
  .pbtn[data-p="7"]{border-color:#22ffcc;color:#22ffcc}
  .pbtn[data-p="2"].on{box-shadow:0 0 16px rgba(51,136,255,.3)}
  .pbtn[data-p="3"].on{box-shadow:0 0 16px rgba(255,170,34,.3)}
  .pbtn[data-p="5"].on{box-shadow:0 0 16px rgba(255,34,136,.3)}
  .pbtn[data-p="7"].on{box-shadow:0 0 16px rgba(34,255,204,.3)}
  .info{font-size:10px;line-height:2;font-variant-numeric:tabular-nums;max-width:240px}
  .info .row{display:flex;justify-content:space-between}
  .info .val{color:#bbccdd}
  .reveal{
    margin-top:16px;padding:10px 14px;border:1px solid #222233;border-radius:4px;
    font-size:10px;line-height:1.7;max-width:240px;transition:all .4s;
    background:rgba(6,6,14,.8);
  }
  .reveal.lit{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.03)}
  .reveal .key{color:#fff;font-weight:700}
  .reveal .miss{font-size:12px;letter-spacing:.15em}
  .readout{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:.2em;color:#334455;z-index:10;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .cube-label{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    pointer-events:none;z-index:5;font-size:9px;letter-spacing:.3em;
    color:#33445500;transition:color .6s;text-transform:uppercase;
  }
  .cube-label.show{color:#33445566}
  .eq{
    margin:0 0 16px;padding:10px 14px;border:1px solid #1a1a2a;border-radius:4px;
    font-size:12px;letter-spacing:.08em;color:#667788;background:rgba(6,6,14,.6);
    text-align:center;max-width:240px;line-height:1.8;
  }
  .eq .phi{color:#ff2288;font-weight:700}
  .eq .sym{color:#aabbcc}
  .physics-map{font-size:9px;line-height:1.6;margin-bottom:16px;max-width:240px;color:#556677}
  .physics-map .pm-row{display:flex;gap:6px;align-items:baseline;margin:2px 0}
  .physics-map .pm-p{font-weight:700;width:14px;text-align:right}
  .physics-map .pm-eq{color:#445566}
  .physics-map .pm-v{color:#8899aa}
</style>

<div class="panel">
  <div class="title">210-Gon Primorial Prism</div>
  <div class="subtitle">2 &times; 3 &times; 5 &times; 7 &mdash; Maximum Harmonic Container</div>
  <div class="eq">
    <span class="phi">&Phi;</span> <span class="sym">&equiv;</span> c <span class="sym">&equiv;</span> g <span class="sym">&equiv;</span> &part;<sub>t</sub><span class="phi">&Phi;</span>
  </div>
  <div class="prime-row">
    <button class="pbtn on" data-p="2"><span class="num">2</span><span class="lbl">duality</span></button>
    <button class="pbtn on" data-p="3"><span class="num">3</span><span class="lbl">space</span></button>
    <button class="pbtn on" data-p="5"><span class="num">5</span><span class="lbl">&Phi; &equiv; c &equiv; g</span></button>
    <button class="pbtn on" data-p="7"><span class="num">7</span><span class="lbl">eigenmodes</span></button>
  </div>
  <div class="physics-map">
    <div class="pm-row"><span class="pm-p" style="color:#3388ff">P2</span><span class="pm-eq">=</span><span class="pm-v">Wave/particle, matter/antimatter, observer/observed</span></div>
    <div class="pm-row"><span class="pm-p" style="color:#ffaa22">P3</span><span class="pm-eq">=</span><span class="pm-v">Three spatial dimensions (x, y, z)</span></div>
    <div class="pm-row"><span class="pm-p" style="color:#ff2288">P5</span><span class="pm-eq">=</span><span class="pm-v">Unified field: &Phi; &equiv; c &equiv; g &equiv; &part;<sub>t</sub>&Phi;</span></div>
    <div class="pm-row"><span class="pm-p" style="color:#22ffcc">P7</span><span class="pm-eq">=</span><span class="pm-v">Lattice eigenmodes (7-line convergence nodes)</span></div>
  </div>
  <div class="info" id="info"></div>
  <div class="reveal" id="reveal"></div>
</div>
<div class="readout" id="readout"></div>
<div class="cube-label" id="cube-label">GROUND STATE &mdash; EARTH</div>
<canvas id="c"></canvas>

<script>
const N = 210;
const PI2 = Math.PI * 2;
const PRIMES = [
  {p:2, color:'#3388ff', rgb:[51,136,255], name:'Bilateral'},
  {p:3, color:'#ffaa22', rgb:[255,170,34], name:'Trigonal'},
  {p:5, color:'#ff2288', rgb:[255,34,136], name:'Pentagonal'},
  {p:7, color:'#22ffcc', rgb:[34,255,204], name:'Heptagonal'},
];

const active = [true, true, true, true];
let angleY = 0, angleX = 0.42, autoRot = true, lastDrag = 0;
let dragX = 0, dragY = 0, dragging = false;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const R = 1, H = 0.7;
const topV = [], botV = [];
for (let i = 0; i < N; i++) {
  const a = (i / N) * PI2;
  topV.push([Math.cos(a)*R, H/2, Math.sin(a)*R]);
  botV.push([Math.cos(a)*R, -H/2, Math.sin(a)*R]);
}

// cube vertices (ground state)
const S = 0.18;
const cubeV = [
  [-S,-S,-S],[ S,-S,-S],[ S, S,-S],[-S, S,-S],
  [-S,-S, S],[ S,-S, S],[ S, S, S],[-S, S, S],
];
const cubeE = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];

function rotY(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [p[0]*c + p[2]*s, p[1], -p[0]*s + p[2]*c];
}
function rotX(p, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [p[0], p[1]*c - p[2]*s, p[1]*s + p[2]*c];
}
function proj(p, cx, cy, fov) {
  const z = p[2] + fov;
  if (z < 0.01) return null;
  const sc = fov / z;
  return [cx + p[0]*sc, cy - p[1]*sc, z];
}

function transform(v) {
  return rotX(rotY(v, angleY), angleX);
}

function getActivePrimes() {
  return PRIMES.filter((_, i) => active[i]).map(p => p.p);
}

function lcmArr(arr) {
  return arr.reduce((a, b) => {
    const g = gcd(a, b);
    return (a / g) * b;
  }, 1);
}
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

function getIntersection(primes) {
  if (primes.length === 0) return { step: 1, count: N, verts: Array.from({length:N}, (_,i)=>i) };
  const step = lcmArr(primes);
  const count = Math.floor(N / step);
  const verts = [];
  for (let i = 0; i < N; i += step) verts.push(i);
  return { step, count, verts };
}

function polyName(n) {
  const names = {
    1:'monogon (unity)', 2:'diameter', 3:'triangle', 4:'square',
    5:'pentagon', 6:'hexagon', 7:'heptagon', 8:'octagon',
    9:'enneagon', 10:'decagon', 12:'dodecagon', 14:'tetradecagon',
    15:'pentadecagon', 21:'icosikaihenagon', 30:'triacontagon',
    35:'triacontakaipentagon', 42:'tetracontakaidigon',
    70:'heptacontagon', 105:'hecatokaipentagon', 210:'full 210-gon',
  };
  return names[n] || n+'-gon';
}

function getMissingPrimeInsight(ap) {
  if (ap.length !== 3) return null;
  const all = [2,3,5,7];
  const missing = all.find(p => !ap.includes(p));
  if (!missing) return null;
  const product = ap.reduce((a,b) => a*b, 1);
  const resultN = N / product;
  const missingInfo = PRIMES.find(pr => pr.p === missing);
  return { missing, product, resultN, missingInfo };
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Interaction
canvas.addEventListener('mousedown', e => { dragging = true; dragX = e.clientX; dragY = e.clientY; });
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  angleY += (e.clientX - dragX) * 0.005;
  angleX += (e.clientY - dragY) * 0.005;
  angleX = Math.max(-1.2, Math.min(1.2, angleX));
  dragX = e.clientX; dragY = e.clientY;
  lastDrag = Date.now();
  autoRot = false;
});
canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; });

canvas.addEventListener('touchstart', e => {
  dragging = true;
  dragX = e.touches[0].clientX; dragY = e.touches[0].clientY;
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  if (!dragging) return;
  angleY += (e.touches[0].clientX - dragX) * 0.005;
  angleX += (e.touches[0].clientY - dragY) * 0.005;
  angleX = Math.max(-1.2, Math.min(1.2, angleX));
  dragX = e.touches[0].clientX; dragY = e.touches[0].clientY;
  lastDrag = Date.now(); autoRot = false;
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', () => { dragging = false; });

document.querySelectorAll('.pbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const idx = PRIMES.findIndex(p => p.p === parseInt(btn.dataset.p));
    active[idx] = !active[idx];
    btn.classList.toggle('on', active[idx]);
    updateInfo();
  });
});

function updateInfo() {
  const ap = getActivePrimes();
  const inter = getIntersection(ap);
  const el = document.getElementById('info');
  const rev = document.getElementById('reveal');
  const readout = document.getElementById('readout');
  const cubeEl = document.getElementById('cube-label');

  let html = '';
  html += '<div class="row"><span>Active primes</span><span class="val">'+(ap.length?ap.join(' × '):'none')+'</span></div>';
  html += '<div class="row"><span>Product (step)</span><span class="val">'+(ap.length?ap.reduce((a,b)=>a*b,1):1)+'</span></div>';
  html += '<div class="row"><span>Intersection vertices</span><span class="val">'+inter.count+' / 210</span></div>';
  html += '<div class="row"><span>Intersection shape</span><span class="val">'+polyName(inter.count)+'</span></div>';
  el.innerHTML = html;

  const insight = getMissingPrimeInsight(ap);
  if (insight) {
    rev.classList.add('lit');
    rev.innerHTML = '<span class="key">Three-prime intersection reveals:</span><br>' +
      ap.join(' &times; ') + ' = ' + insight.product +
      ' &nbsp;&rarr;&nbsp; every ' + insight.product + 'th vertex<br>' +
      '<span class="miss" style="color:'+insight.missingInfo.color+'">' +
      inter.count + '-gon = ' + polyName(inter.count).toUpperCase() + '</span><br>' +
      'The missing prime <span style="color:'+insight.missingInfo.color+';font-weight:700">P' +
      insight.missing + '</span>\'s own geometry emerges<br>from the other three.';
  } else if (ap.length === 4) {
    rev.classList.add('lit');
    rev.innerHTML = '<span class="key">&Phi; &equiv; c &equiv; g &equiv; &part;<sub>t</sub>&Phi;</span><br>' +
      'Duality &times; Space &times; Field &times; Structure<br>' +
      '2 &times; 3 &times; 5 &times; 7 = 210 &rarr; <span class="miss" style="color:#ffffff">UNITY</span><br>' +
      'All harmonics converge to a single point.<br>' +
      '<span style="color:#44ddff;font-weight:700">That point is Earth.</span><br>' +
      'The observer at the center of the<br>' +
      '<span style="color:#ffffff">cube ground state</span>.';
  } else if (ap.length === 2) {
    const step = ap[0] * ap[1];
    const ct = N / step;
    rev.classList.remove('lit');
    rev.innerHTML = 'Two-prime intersection:<br>' +
      ap.join(' &times; ') + ' = ' + step + ' &rarr; ' + ct + '-gon (' + polyName(ct) + ')';
  } else {
    rev.classList.remove('lit');
    rev.innerHTML = ap.length === 0
      ? 'Toggle primes to explore harmonic sub-structures.'
      : 'Single prime: every '+ap[0]+'th vertex &rarr; '+(N/ap[0])+'-gon';
  }

  readout.textContent = ap.length === 4
    ? 'Φ ≡ c ≡ g ≡ ∂ₜΦ    ·    DUALITY × SPACE × FIELD × STRUCTURE = REALITY    ·    210 = 2 × 3 × 5 × 7'
    : '210 = 2 × 3 × 5 × 7    ·    PRIMORIAL OF 7    ·    MAXIMUM EIGENMODE CONTAINER';
  cubeEl.classList.toggle('show', ap.length === 4);
}

function drawLine(a, b, cx, cy, fov) {
  const pa = proj(transform(a), cx, cy, fov);
  const pb = proj(transform(b), cx, cy, fov);
  if (!pa || !pb) return;
  ctx.moveTo(pa[0], pa[1]);
  ctx.lineTo(pb[0], pb[1]);
}

function drawPrism(cx, cy, fov, time) {
  ctx.clearRect(0, 0, canvas.width/(window.devicePixelRatio||1), canvas.height/(window.devicePixelRatio||1));

  const W = window.innerWidth, HH = window.innerHeight;
  const scale = Math.min(W, HH) * 0.38;

  // Background radial glow
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale*1.5);
  grad.addColorStop(0, '#0a0a18');
  grad.addColorStop(1, '#06060e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, HH);

  const fovScaled = fov * scale;

  // Draw full wireframe (faint)
  ctx.strokeStyle = '#12121e';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const ni = (i+1) % N;
    drawLine(topV[i], topV[ni], cx, cy, fovScaled);
    drawLine(botV[i], botV[ni], cx, cy, fovScaled);
  }
  // Side edges (every 10th for wireframe)
  for (let i = 0; i < N; i += 10) {
    drawLine(topV[i], botV[i], cx, cy, fovScaled);
  }
  ctx.stroke();

  const ap = getActivePrimes();

  // Draw per-prime sub-polygons
  PRIMES.forEach((pr, idx) => {
    if (!active[idx]) return;
    const step = pr.p;
    const verts = [];
    for (let i = 0; i < N; i += step) verts.push(i);

    // Sub-polygon edges on top cap
    ctx.strokeStyle = pr.color + '44';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (let j = 0; j < verts.length; j++) {
      const nj = (j+1) % verts.length;
      drawLine(topV[verts[j]], topV[verts[nj]], cx, cy, fovScaled);
      drawLine(botV[verts[j]], botV[verts[nj]], cx, cy, fovScaled);
    }
    ctx.stroke();

    // Vertices as dots
    ctx.fillStyle = pr.color + '88';
    for (const vi of verts) {
      const pt = proj(transform(topV[vi]), cx, cy, fovScaled);
      const pb = proj(transform(botV[vi]), cx, cy, fovScaled);
      if (pt) { ctx.beginPath(); ctx.arc(pt[0], pt[1], 1.5, 0, PI2); ctx.fill(); }
      if (pb) { ctx.beginPath(); ctx.arc(pb[0], pb[1], 1.5, 0, PI2); ctx.fill(); }
    }
  });

  // Intersection polygon (key visual)
  if (ap.length >= 2) {
    const inter = getIntersection(ap);
    const insight = getMissingPrimeInsight(ap);
    const iColor = insight ? insight.missingInfo.color : '#ffffff';
    const pulse = 0.6 + 0.4 * Math.sin(time * 2);

    // Draw intersection polygon prominently
    ctx.strokeStyle = iColor;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = iColor;
    ctx.shadowBlur = 12 * pulse;
    ctx.beginPath();
    for (let j = 0; j < inter.verts.length; j++) {
      const nj = (j+1) % inter.verts.length;
      drawLine(topV[inter.verts[j]], topV[inter.verts[nj]], cx, cy, fovScaled);
      drawLine(botV[inter.verts[j]], botV[inter.verts[nj]], cx, cy, fovScaled);
    }
    ctx.stroke();

    // Vertical pillars at intersection vertices
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const vi of inter.verts) {
      drawLine(topV[vi], botV[vi], cx, cy, fovScaled);
    }
    ctx.stroke();

    // Bright vertex dots
    ctx.shadowBlur = 20 * pulse;
    ctx.fillStyle = iColor;
    for (const vi of inter.verts) {
      const pt = proj(transform(topV[vi]), cx, cy, fovScaled);
      const pb = proj(transform(botV[vi]), cx, cy, fovScaled);
      if (pt) { ctx.beginPath(); ctx.arc(pt[0], pt[1], 3.5, 0, PI2); ctx.fill(); }
      if (pb) { ctx.beginPath(); ctx.arc(pb[0], pb[1], 3.5, 0, PI2); ctx.fill(); }
    }

    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';

    // Label the intersection polygon on top cap
    if (inter.verts.length >= 2 && inter.verts.length <= 30) {
      const mid = inter.verts[0];
      const pt = proj(transform(topV[mid]), cx, cy, fovScaled);
      if (pt) {
        ctx.fillStyle = iColor + 'aa';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(polyName(inter.count).toUpperCase(), pt[0], pt[1] - 12);
      }
    }
  }

  // Center cube (ground state) + Earth — visible when all 4 active
  if (ap.length === 4) {
    const cubeAlpha = 0.5 + 0.3 * Math.sin(time * 1.5);
    const PHI = 1.618033988749;

    // Phi-shell rings (concentric circles at phi-scaled radii)
    const origin = proj(transform([0,0,0]), cx, cy, fovScaled);
    if (origin) {
      const baseR = S * fovScaled / (fovScaled); // approximate screen-space scale
      for (let sh = 0; sh < 4; sh++) {
        const shellR = (8 + sh * 8 * PHI) * (0.7 + 0.3 * Math.sin(time * 0.8 + sh));
        const shellAlpha = 0.08 - sh * 0.015;
        ctx.strokeStyle = 'rgba(68,221,255,' + Math.max(0.02, shellAlpha) + ')';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.arc(origin[0], origin[1], shellR, 0, PI2);
        ctx.stroke();
      }
    }

    // Cube wireframe
    ctx.strokeStyle = 'rgba(255,255,255,' + (cubeAlpha * 0.7) + ')';
    ctx.lineWidth = 1.8;
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    for (const [a, b] of cubeE) {
      drawLine(cubeV[a], cubeV[b], cx, cy, fovScaled);
    }
    ctx.stroke();

    // cube vertices
    ctx.fillStyle = 'rgba(255,255,255,' + (cubeAlpha * 0.8) + ')';
    for (const v of cubeV) {
      const pt = proj(transform(v), cx, cy, fovScaled);
      if (pt) { ctx.beginPath(); ctx.arc(pt[0], pt[1], 2, 0, PI2); ctx.fill(); }
    }

    // EARTH — the unity point at center
    if (origin) {
      const earthPulse = 0.7 + 0.3 * Math.sin(time * 2.5);
      // outer glow
      ctx.shadowColor = '#44ddff';
      ctx.shadowBlur = 30 * earthPulse;
      ctx.fillStyle = 'rgba(68,221,255,' + (0.6 * earthPulse) + ')';
      ctx.beginPath();
      ctx.arc(origin[0], origin[1], 5, 0, PI2);
      ctx.fill();
      // bright core
      ctx.shadowBlur = 15;
      ctx.fillStyle = 'rgba(200,240,255,' + (0.9 * earthPulse) + ')';
      ctx.beginPath();
      ctx.arc(origin[0], origin[1], 2.5, 0, PI2);
      ctx.fill();
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      // label
      ctx.fillStyle = 'rgba(68,221,255,' + (0.5 + 0.3 * earthPulse) + ')';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('EARTH', origin[0], origin[1] + 18);
      ctx.font = '8px monospace';
      ctx.fillStyle = 'rgba(68,221,255,0.3)';
      ctx.fillText('Φ ≡ c ≡ g ≡ ∂ₜΦ', origin[0], origin[1] + 30);
    }

    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  }

  // Draw prime sub-polygon labels (only for the fundamental polygon: p-gon)
  PRIMES.forEach((pr, idx) => {
    if (!active[idx]) return;
    // Show the fundamental p-gon (every N/p-th vertex)
    const fundStep = N / pr.p;
    const fundVerts = [];
    for (let i = 0; i < N; i += fundStep) fundVerts.push(i);

    ctx.strokeStyle = pr.color + 'cc';
    ctx.lineWidth = 2;
    ctx.shadowColor = pr.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let j = 0; j < fundVerts.length; j++) {
      const nj = (j+1) % fundVerts.length;
      drawLine(topV[fundVerts[j]], topV[fundVerts[nj]], cx, cy, fovScaled);
    }
    ctx.stroke();

    // dots on fundamental polygon
    ctx.fillStyle = pr.color;
    for (const vi of fundVerts) {
      const pt = proj(transform(topV[vi]), cx, cy, fovScaled);
      if (pt) { ctx.beginPath(); ctx.arc(pt[0], pt[1], 3, 0, PI2); ctx.fill(); }
    }
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  });

  // Combination table (bottom right)
  const ap2 = getActivePrimes();
  if (ap2.length >= 1) {
    const tx = W - 24;
    let ty = HH - 20;
    ctx.textAlign = 'right';
    ctx.font = '9px monospace';

    // Show all possible sub-combinations
    const combos = [];
    for (let mask = 1; mask < (1 << 4); mask++) {
      const bits = [];
      for (let b = 0; b < 4; b++) if (mask & (1 << b)) bits.push(b);
      if (bits.every(b => active[b]) && bits.length <= ap2.length) {
        const ps = bits.map(b => PRIMES[b].p);
        const prod = ps.reduce((a,b) => a*b, 1);
        const ct = N / prod;
        combos.push({ ps, prod, ct, bits });
      }
    }
    combos.sort((a, b) => a.ct - b.ct);

    for (const c of combos) {
      const label = c.ps.join('×') + '=' + c.prod;
      const shape = c.ct + ' (' + polyName(c.ct) + ')';
      // color = blend of component primes, or just use white for multi
      let col = c.bits.length === 1 ? PRIMES[c.bits[0]].color : '#667788';
      if (c.bits.length === 3) {
        const missing = [0,1,2,3].find(b => !c.bits.includes(b));
        col = PRIMES[missing].color;
      }
      if (c.bits.length === 4) col = '#ffffff';
      ctx.fillStyle = col + '88';
      ctx.fillText(label + '  →  ' + shape, tx, ty);
      ty -= 14;
    }
    ctx.fillStyle = '#44556688';
    ctx.fillText('HARMONIC DECOMPOSITION', tx, ty);
    ctx.textAlign = 'left';
  }
}

function animate(t) {
  const time = t * 0.001;
  if (!dragging && Date.now() - lastDrag > 3000) autoRot = true;
  if (autoRot) angleY += 0.003;

  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  drawPrism(cx, cy, 3.5, time);
  requestAnimationFrame(animate);
}

updateInfo();
requestAnimationFrame(animate);
</script>
